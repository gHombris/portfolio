document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

space-6: 24.0px;\n  --space-8: 32.0px;\n\n  --radius-sm: 0px;\n  --radius-md: 0px;\n  --radius-lg: 0px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script src=\"c2672ac1-7a05-46fd-b4f8-2a8d51a6fb1c\"><\u002Fscript>\n<script src=\"00fd5f0d-7f26-41bf-8209-79bc11ac0dbb\"><\u002Fscript>\n<style>\nhtml{scroll-behavior:smooth}\n:root{--accent-text:#ae1800}\n[data-theme=\"dark\"]{--color-bg:#161514;--color-surface:#211f1e;--color-text:#f3f2f2;--color-accent:#ff563c;--color-divider:color-mix(in srgb,#f3f2f2 40%,transparent);--accent-text:#ff9783}\nbody{transition:background .3s,color .3s;overflow-x:hidden}\na{color:var(--accent-text)}\na:hover{color:var(--color-accent)}\n@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<sc-if value=\"{{ showFallback }}\" hint-placeholder-val=\"{{ true }}\">\n  <div aria-hidden=\"true\" style=\"position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.22;background-image:radial-gradient(var(--color-text) 1.2px,transparent 1.6px);background-size:28px 28px;-webkit-mask-image:linear-gradient(105deg,transparent 30%,#000 95%);mask-image:linear-gradient(105deg,transparent 30%,#000 95%)\"><\u002Fdiv>\n<\u002Fsc-if>\n<canvas ref=\"{{ canvasRef }}\" aria-hidden=\"true\" style=\"position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block\"><\u002Fcanvas>\n\n<div style=\"position:relative;z-index:1\">\n\n  <header style=\"position:sticky;top:0;z-index:10;background:var(--color-bg);border-bottom:2px solid var(--color-text)\">\n    <nav style=\"max-width:1280px;margin:0 auto;padding:12px clamp(20px,5vw,72px);display:flex;flex-wrap:wrap;align-items:center;gap:6px 22px\">\n      <a href=\"#topo\" style=\"font-weight:800;font-size:17px;letter-spacing:-.01em;color:var(--color-text);text-decoration:none;margin-right:auto;white-space:nowrap\">Gabriel Hombris<\u002Fa>\n      <a href=\"#sobre\" style=\"color:var(--color-text);text-decoration:none;font-size:14px\" style-hover=\"color:var(--color-accent)\">Sobre<\u002Fa>\n      <a href=\"#projetos\" style=\"color:var(--color-text);text-decoration:none;font-size:14px\" style-hover=\"color:var(--color-accent)\">Projetos<\u002Fa>\n      <a href=\"#skills\" style=\"color:var(--color-text);text-decoration:none;font-size:14px\" style-hover=\"color:var(--color-accent)\">Skills<\u002Fa>\n      <a href=\"#contato\" style=\"color:var(--color-text);text-decoration:none;font-size:14px\" style-hover=\"color:var(--color-accent)\">Contato<\u002Fa>\n      <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ toggleTheme }}\" aria-label=\"Alternar tema\" style=\"font-size:12px;padding:6px 10px;gap:8px\"><span style=\"width:10px;height:10px;background:var(--color-text);display:block\"><\u002Fspan>{{ themeLabel }}<\u002Fbutton>\n    <\u002Fnav>\n  <\u002Fheader>\n\n  <section id=\"topo\" data-screen-label=\"Hero\" style=\"max-width:1280px;margin:0 auto;padding:clamp(48px,8vw,96px) clamp(20px,5vw,72px);min-height:calc(100vh - 60px);display:flex;flex-direction:column;justify-content:space-between;gap:48px\">\n    <div style=\"font-size:12px;letter-spacing:.1em;text-transform:uppercase;display:flex;flex-wrap:wrap;gap:6px 20px\">\n      <span>Engenharia de Software<\u002Fspan><span>FIAP<\u002Fspan><span>4º semestre<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:28px;max-width:760px\">\n      <h1 style=\"font-size:clamp(58px,11.5vw,172px);line-height:.88;letter-spacing:-.045em;margin:0\">Gabriel<br>Hombris<\u002Fh1>\n      <p style=\"font-size:clamp(20px,2.6vw,32px);line-height:1.15;font-weight:600;margin:0;letter-spacing:-.01em\">Machine Learning e <span style=\"color:var(--accent-text)\">Visão Computacional<\u002Fspan>.<\u002Fp>\n      <p style=\"font-size:17px;max-width:480px;margin:0;text-wrap:pretty\">Treino modelos de detecção de objetos e construo o sistema em volta deles, do banco de dados ao deploy.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:12px\">\n        <a class=\"btn btn-primary\" href=\"#projetos\" style=\"font-size:16px;padding:14px 18px;min-width:200px;justify-content:space-between\">Ver projetos <span>↓<\u002Fspan><\u002Fa>\n        <a class=\"btn btn-secondary\" href=\"https://github.com/gHombris\" target=\"_blank\" rel=\"noopener\" style=\"font-size:16px;padding:14px 18px;min-width:160px;justify-content:space-between;border-color:var(--color-text)\">GitHub <span>↗<\u002Fspan><\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;justify-content:space-between;gap:16px;font-size:12px;border-top:2px solid var(--color-text);padding-top:10px\">\n      <span>São Paulo, Brasil<\u002Fspan>\n      <span style=\"opacity:.7\">{{ hint }}<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"sobre\" data-screen-label=\"Sobre\" style=\"max-width:1280px;margin:0 auto;padding:clamp(56px,9vw,120px) clamp(20px,5vw,72px)\">\n    <div style=\"border-top:2px solid var(--color-text);padding-top:14px;display:flex;justify-content:space-between;font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:clamp(28px,5vw,56px)\"><span>01<\u002Fspan><span>Sobre<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:clamp(28px,5vw,72px);align-items:start\">\n      <div style=\"display:flex;flex-direction:column;gap:20px\">\n        <h2 style=\"font-size:clamp(30px,4.4vw,56px);letter-spacing:-.03em;line-height:1;margin:0;text-wrap:balance\">Estudo Engenharia de Software e trabalho com modelos que enxergam.<\u002Fh2>\n        <p style=\"font-size:17px;margin:0;text-wrap:pretty\">Estou no 4º semestre na FIAP e meu foco é Machine Learning e Visão Computacional. Gosto de acompanhar um projeto do começo ao fim: já levei um modelo de detecção do treinamento até produção e coloquei no ar um e-commerce que vende de verdade.<\u002Fp>\n        <p style=\"font-size:17px;margin:0;text-wrap:pretty\">Nos projetos abaixo conto o que fiz, com qual stack e qual foi o meu papel em cada um.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:2px solid var(--color-divider);margin-top:8px\">\n          <div style=\"padding:12px 12px 0 0;display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.65\">Curso<\u002Fspan><span style=\"font-weight:800;font-size:15px\">Eng. de Software<\u002Fspan><\u002Fdiv>\n          <div style=\"padding:12px 12px 0;border-left:2px solid var(--color-divider);display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.65\">Onde<\u002Fspan><span style=\"font-weight:800;font-size:15px\">FIAP, 4º sem.<\u002Fspan><\u002Fdiv>\n          <div style=\"padding:12px 0 0 12px;border-left:2px solid var(--color-divider);display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.65\">Foco<\u002Fspan><span style=\"font-weight:800;font-size:15px\">ML e Visão<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"grayscale\" style=\"aspect-ratio:4/5;max-width:440px;width:100%;justify-self:end;background:var(--color-surface)\">\n        <image-slot id=\"retrato\" shape=\"rect\" placeholder=\"Seu retrato (fica em preto e branco)\" src=\"d10a82d9-2b0f-4d50-9fa1-beb9dc8d06ad\"><\u002Fimage-slot>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"projetos\" data-screen-label=\"Projetos\" style=\"max-width:1280px;margin:0 auto;padding:clamp(56px,9vw,120px) clamp(20px,5vw,72px)\">\n    <div style=\"border-top:2px solid var(--color-text);padding-top:14px;display:flex;justify-content:space-between;font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:clamp(28px,5vw,56px)\"><span>02<\u002Fspan><span>Projetos<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:clamp(24px,4vw,48px)\">\n\n      <article sc-camel-on-mouse-move=\"{{ tilt }}\" sc-camel-on-mouse-leave=\"{{ untilt }}\" style=\"background:var(--color-surface);border-top:2px solid var(--color-text);padding:clamp(20px,3.2vw,40px);transition:transform .25s ease-out;transform-style:preserve-3d;will-change:transform;display:flex;flex-direction:column;gap:28px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;transform:translateZ(28px)\">\n          <span style=\"font-weight:800;font-size:14px\">01<\u002Fspan>\n          <span style=\"font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:var(--color-accent);color:var(--color-bg);padding:4px 10px;font-weight:600\">Em produção<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:clamp(24px,4vw,56px);align-items:start\">\n          <div style=\"display:flex;flex-direction:column;gap:18px\">\n            <h3 style=\"font-size:clamp(32px,5vw,64px);letter-spacing:-.035em;line-height:.95;margin:0\">Moranguda Brechó<\u002Fh3>\n            <p style=\"font-size:16px;margin:0;text-wrap:pretty\">E-commerce para um brechó de roupas vintage e upcycling vender peças únicas online. Tem catálogo com galeria de fotos, carrinho, frete fixo por cidade ou retirada presencial, pagamento via Pix com confirmação manual e um painel administrativo completo.<\u002Fp>\n            <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n              <a class=\"btn btn-secondary\" href=\"https://moranguda.vercel.app\" target=\"_blank\" rel=\"noopener\" style=\"border-color:var(--color-text);gap:14px\">moranguda.vercel.app <span>↗<\u002Fspan><\u002Fa>\n              <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ toggle1 }}\" style=\"padding-inline:8px;color:var(--accent-text)\">{{ label1 }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"aspect-ratio:16/10;background:var(--color-bg)\">\n            <image-slot id=\"shot-moranguda\" shape=\"rect\" placeholder=\"Screenshot da loja\" src=\"cbb046e4-d095-4c72-9872-a08bc523d0b8\"><\u002Fimage-slot>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ open1 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"border-top:2px solid var(--color-divider);padding-top:24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:28px clamp(24px,4vw,56px)\">\n            <div style=\"display:flex;flex-direction:column;gap:20px\">\n              <div style=\"display:flex;flex-direction:column;gap:10px\">\n                <h6 style=\"margin:0\">Stack<\u002Fh6>\n                <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n                  <span style=\"font-size:12px;border:1px solid var(--color-divider);padding:3px 9px\">React 19<\u002Fspan><span style=\"font-size:12px;border:1px solid var(--color-divider);padding:3px 9px\">TanStack Start (SSR)<\u002Fspan><span style=\"font-size:12px;border:1px solid var(--color-divider);padding:3px 9px\">TanStack Router<\u002Fspan><span style=\"font-size:12px;border:1px solid var(--color-divider);padding:3px 9px\">TanStack Query<\u002Fspan><span style=\"font-size:12px;border:1px solid var(--color-divider);padding:3px 9px\">Tailwind CSS 4<\u002Fspan><span style=\"font-size:12px;border:1px solid var(--color-divider);padding:3px 9px\">Zod<\u002Fspan><span style=\"font-size:12px;border:1px solid var(--color-divider);padding:3px 9px\">Supabase (PostgreSQL + Storage + Auth)<\u002Fspan><span style=\"font-size:12px;border:1px solid var(--color-divider);padding:3px 9px\">Vercel<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:8px\">\n                <h6 style=\"margin:0\">Meu papel<\u002Fh6>\n                <p style=\"margin:0;font-size:15px;text-wrap:pretty\">Fiz a implementação completa (código, migrations e testes) a partir das decisões de produto e de negócio do parceiro da loja. O deploy é automático na Vercel, via GitHub.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <h6 style=\"margin:0\">Destaques técnicos<\u002Fh6>\n              <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;font-size:15px\">\n                <li style=\"padding:10px 0;border-top:1px solid var(--color-divider)\">Gerador próprio do payload Pix (BR Code/EMV), com o CRC16 implementado à mão.<\u002Fli>\n                <li style=\"padding:10px 0;border-top:1px solid var(--color-divider)\">Preço final de ofertas e descontos sempre recalculado no servidor, sem confiar no carrinho do cliente.<\u002Fli>\n                <li style=\"padding:10px 0;border-top:1px solid var(--color-divider)\">Bloqueio de checkout no servidor, não só na interface.<\u002Fli>\n                <li style=\"padding:10px 0;border-top:1px solid var(--color-divider)\">Sessão de admin própria, com cookie selado e rate limit de login.<\u002Fli>\n                <li style=\"padding:10px 0;border-top:1px solid var(--color-divider)\">Múltiplas fotos por peça, com migration de banco.<\u002Fli>\n                <li style=\"padding:10px 0;border-top:1px solid var(--color-divider)\">Dashboard de vendas com faturamento, pedidos, peças vendidas e filtros por período.<\u002Fli>\n                <li style=\"padding:10px 0;border-top:1px solid var(--color-divider)\">Correção de uma CVE real, com upgrade de dependências e conflito de versões resolvido.<\u002Fli>\n              <\u002Ful>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Farticle>\n\n      <article sc-camel-on-mouse-move=\"{{ tilt }}\" sc-camel-on-mouse-leave=\"{{ untilt }}\" style=\"background:var(--color-surface);border-top:2px solid var(--color-text);padding:clamp(20px,3.2vw,40px);transition:transform .25s ease-out;transform-style:preserve-3d;will-change:transform;display:flex;flex-direction:column;gap:28px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;transform:translateZ(28px)\">\n          <span style=\"font-weight:800;font-size:14px\">02<\u002Fspan>\n          <span style=\"font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--color-text);padding:3px 10px;font-weight:600\">Protótipo funcional<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:clamp(24px,4vw,56px);align-items:start\">\n          <div style=\"display:flex;flex-direction:column;gap:18px\">\n            <div style=\"display:flex;flex-direction:column;gap:6px\">\n              <h3 style=\"font-size:clamp(32px,5vw,64px);letter-spacing:-.035em;line-height:.95;margin:0\">Radar de Retenção<\u002Fh3>\n              <span style=\"font-size:14px;font-weight:600\">TOTVS Meeting Insights<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"font-size:16px;margin:0;text-wrap:pretty\">Pipeline de triagem de risco de cancelamento de clientes a partir de 1.174 transcrições de reuniões comerciais. Um LLM extrai dados estruturados de cada reunião e um banco Postgres é a fonte única de dados do dashboard de vendas. Projeto para a TOTVS, rodando localmente.<\u002Fp>\n            <p style=\"font-size:14px;margin:0;padding:10px 12px;border:1px solid var(--color-accent);color:var(--accent-text);text-wrap:pretty\">É um protótipo de triagem de sinais de risco, não um modelo preditivo de churn validado: não há rótulo histórico de cancelamento disponível.<\u002Fp>\n            <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n              <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ toggle2 }}\" style=\"padding-inline:8px;color:var(--accent-text)\">{{ label2 }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"aspect-ratio:16/10;background:var(--color-bg)\">\n            <image-slot id=\"shot-radar\" shape=\"rect\" placeholder=\"Screenshot do dashboard\" src=\"5fb5e416-9e20-40e9-906f-85392a66383d\"><\u002Fimage-slot>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ open2 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"border-top:2px solid var(--color-divider);padding-top:24px;display:flex;flex-direction:column;gap:28px\">\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:20px 0\">\n              <div style=\"padding:0 16px 0 0;display:flex;flex-direction:column;gap:4px\"><span style=\"font-size:clamp(34px,4vw,52px);font-weight:800;letter-spacing:-.03em;line-height:1\">873<\u002Fspan><span style=\"font-size:13px\">transcrições processadas<\u002Fspan><\u002Fdiv>\n              <div style=\"padding:0 16px;border-left:2px solid var(--color-divider);display:flex;flex-direction:column;gap:4px\"><span style=\"font-size:clamp(34px,4vw,52px);font-weight:800;letter-spacing:-.03em;line-height:1\">99,5%<\u002Fspan><span style=\"font-size:13px\">de cobertura de features por cliente<\u002Fspan><\u002Fdiv>\n              <div style=\"padding:0 16px;border-left:2px solid var(--color-divider);display:flex;flex-direction:column;gap:4px\"><span style=\"font-size:clamp(34px,4vw,52px);font-weight:800;letter-spacing:-.03em;line-height:1\">0,511<\u002Fspan><span style=\"font-size:13px\">PR-AUC no teste de viabilidade, lift de 2,04x sobre o baseline aleatório, com features de baixo custo<\u002Fspan><\u002Fdiv>\n              <div style=\"padding:0 0 0 16px;border-left:2px solid var(--color-divider);display:flex;flex-direction:column;gap:4px\"><span style=\"font-size:clamp(34px,4vw,52px);font-weight:800;letter-spacing:-.03em;line-height:1\">482<\u002Fspan><span style=\"font-size:13px\">contas visíveis para um diretor. Um executivo vê só a própria carteira<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:28px clamp(24px,4vw,56px)\">\n              <div style=\"display:flex;flex-direction:column;gap:10px\">\n                <h6 style=\"margin:0\">Stack<\u002Fh6>\n                <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;font-size:15px\">\n                  <li style=\"padding:10px 0;border-top:1px solid var(--color-divider)\"><strong>Python (pandas, numpy)<\u002Fstrong> para o processamento.<\u002Fli>\n                  <li style=\"padding:10px 0;border-top:1px solid var(--color-divider)\"><strong>Google Gemini via API<\u002Fstrong> para a extração estruturada.<\u002Fli>\n                  <li style=\"padding:10px 0;border-top:1px solid var(--color-divider)\"><strong>Supabase (Postgres com Row-Level Security)<\u002Fstrong> para o acesso por papel: admin, diretor, gerente e executivo.<\u002Fli>\n                  <li style=\"padding:10px 0;border-top:1px solid var(--color-divider)\"><strong>scikit-learn<\u002Fstrong> para o teste de viabilidade estatística.<\u002Fli>\n                  <li style=\"padding:10px 0;border-top:1px solid var(--color-divider)\"><strong>Next.js 16, React 19, TypeScript, Tailwind e shadcn/ui<\u002Fstrong> no frontend.<\u002Fli>\n                <\u002Ful>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:8px\">\n                <h6 style=\"margin:0\">Meu papel<\u002Fh6>\n                <p style=\"margin:0;font-size:15px;text-wrap:pretty\">Especifiquei, dirigi tecnicamente e validei o pipeline de dados e as regras de negócio (hierarquia de permissões e cálculo de risco). A implementação foi assistida por IA. O sistema de permissão por papel foi validado no ambiente local.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Farticle>\n\n      <article sc-camel-on-mouse-move=\"{{ tilt }}\" sc-camel-on-mouse-leave=\"{{ untilt }}\" style=\"background:var(--color-surface);border-top:2px solid var(--color-text);padding:clamp(20px,3.2vw,40px);transition:transform .25s ease-out;transform-style:preserve-3d;will-change:transform;display:flex;flex-direction:column;gap:28px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;transform:translateZ(28px)\">\n          <span style=\"font-weight:800;font-size:14px\">03<\u002Fspan>\n          <span style=\"font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--color-text);padding:3px 10px;font-weight:600\">Freelance<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:clamp(24px,4vw,56px);align-items:start\">\n          <div style=\"display:flex;flex-direction:column;gap:18px\">\n            <div style=\"display:flex;flex-direction:column;gap:6px\">\n              <h3 style=\"font-size:clamp(32px,5vw,64px);letter-spacing:-.035em;line-height:.95;margin:0;text-wrap:balance\">Detecção de Objetos em Tempo Real<\u002Fh3>\n              <span style=\"font-size:14px;font-weight:600\">Visão Computacional<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"font-size:16px;margin:0;text-wrap:pretty\">Modelo de visão computacional para detecção de objetos em tempo real, aplicado a segurança industrial. Construí do zero até produção, como freelance para uma startup de tecnologia.<\u002Fp>\n            <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n              <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ toggle3 }}\" style=\"padding-inline:8px;color:var(--accent-text)\">{{ label3 }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-bottom:2px solid var(--color-divider)\">\n            <li style=\"display:grid;grid-template-columns:36px minmax(0,1fr);gap:8px;padding:14px 0;border-top:2px solid var(--color-divider)\"><span style=\"font-size:12px;font-weight:800;color:var(--accent-text)\">A<\u002Fspan><span style=\"font-weight:800;font-size:clamp(18px,2.2vw,24px);letter-spacing:-.02em;line-height:1.1\">RF-DETR<\u002Fspan><\u002Fli>\n            <li style=\"display:grid;grid-template-columns:36px minmax(0,1fr);gap:8px;padding:14px 0;border-top:2px solid var(--color-divider)\"><span style=\"font-size:12px;font-weight:800;color:var(--accent-text)\">B<\u002Fspan><span style=\"font-weight:800;font-size:clamp(18px,2.2vw,24px);letter-spacing:-.02em;line-height:1.1\">PyTorch + PyTorch Lightning<\u002Fspan><\u002Fli>\n            <li style=\"display:grid;grid-template-columns:36px minmax(0,1fr);gap:8px;padding:14px 0;border-top:2px solid var(--color-divider)\"><span style=\"font-size:12px;font-weight:800;color:var(--accent-text)\">C<\u002Fspan><span style=\"font-weight:800;font-size:clamp(18px,2.2vw,24px);letter-spacing:-.02em;line-height:1.1\">ONNX Runtime<\u002Fspan><\u002Fli>\n            <li style=\"display:grid;grid-template-columns:36px minmax(0,1fr);gap:8px;padding:14px 0;border-top:2px solid var(--color-divider)\"><span style=\"font-size:12px;font-weight:800;color:var(--accent-text)\">D<\u002Fspan><span style=\"font-weight:800;font-size:clamp(18px,2.2vw,24px);letter-spacing:-.02em;line-height:1.1\">OpenCV<\u002Fspan><\u002Fli>\n            <li style=\"display:grid;grid-template-columns:36px minmax(0,1fr);gap:8px;padding:14px 0;border-top:2px solid var(--color-divider)\"><span style=\"font-size:12px;font-weight:800;color:var(--accent-text)\">E<\u002Fspan><span style=\"font-weight:800;font-size:clamp(18px,2.2vw,24px);letter-spacing:-.02em;line-height:1.1\">FastAPI + SQLite<\u002Fspan><\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <sc-if value=\"{{ open3 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"border-top:2px solid var(--color-divider);padding-top:24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:28px clamp(24px,4vw,56px)\">\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <h6 style=\"margin:0\">Stack<\u002Fh6>\n              <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;font-size:15px\">\n                <li style=\"padding:10px 0;border-top:1px solid var(--color-divider)\"><strong>RF-DETR<\u002Fstrong>, arquitetura transformer para detecção de objetos.<\u002Fli>\n                <li style=\"padding:10px 0;border-top:1px solid var(--color-divider)\"><strong>PyTorch com PyTorch Lightning<\u002Fstrong> no treinamento, com precisão FP16.<\u002Fli>\n                <li style=\"padding:10px 0;border-top:1px solid var(--color-divider)\"><strong>ONNX Runtime<\u002Fstrong> para a inferência em produção, sem depender do PyTorch.<\u002Fli>\n                <li style=\"padding:10px 0;border-top:1px solid var(--color-divider)\"><strong>OpenCV<\u002Fstrong> no pré-processamento de imagem.<\u002Fli>\n                <li style=\"padding:10px 0;border-top:1px solid var(--color-divider)\"><strong>FastAPI + SQLite<\u002Fstrong>, com cadeia de hash SHA-256 para a integridade dos dados.<\u002Fli>\n              <\u002Ful>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <h6 style=\"margin:0\">Meu papel<\u002Fh6>\n              <p style=\"margin:0;font-size:15px;text-wrap:pretty\">Construí o modelo sozinho, do treinamento à camada de lógica de negócio e ao deploy.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Farticle>\n\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"skills\" data-screen-label=\"Skills\" style=\"max-width:1280px;margin:0 auto;padding:clamp(56px,9vw,120px) clamp(20px,5vw,72px)\">\n    <div style=\"border-top:2px solid var(--color-text);padding-top:14px;display:flex;justify-content:space-between;font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:clamp(28px,5vw,56px)\"><span>03<\u002Fspan><span>Skills<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:32px 0;background:var(--color-bg)\">\n      <div style=\"padding:0 20px 0 0;display:flex;flex-direction:column;gap:14px\">\n        <h6 style=\"margin:0;color:var(--accent-text)\">Linguagens<\u002Fh6>\n        <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;font-weight:800;font-size:clamp(22px,2.4vw,30px);letter-spacing:-.025em;line-height:1.25\"><li>Python<\u002Fli><li>Java<\u002Fli><li>SQL<\u002Fli><\u002Ful>\n      <\u002Fdiv>\n      <div style=\"padding:0 20px;border-left:2px solid var(--color-divider);display:flex;flex-direction:column;gap:14px\">\n        <h6 style=\"margin:0;color:var(--accent-text)\">ML e Visão<\u002Fh6>\n        <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;font-weight:800;font-size:clamp(22px,2.4vw,30px);letter-spacing:-.025em;line-height:1.25\"><li>PyTorch<\u002Fli><li>PyTorch Lightning<\u002Fli><li>ONNX Runtime<\u002Fli><li>OpenCV<\u002Fli><\u002Ful>\n      <\u002Fdiv>\n      <div style=\"padding:0 20px;border-left:2px solid var(--color-divider);display:flex;flex-direction:column;gap:14px\">\n        <h6 style=\"margin:0;color:var(--accent-text)\">Web e dados<\u002Fh6>\n        <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;font-weight:800;font-size:clamp(22px,2.4vw,30px);letter-spacing:-.025em;line-height:1.25\"><li>FastAPI<\u002Fli><li>React<\u002Fli><li>TypeScript<\u002Fli><li>PostgreSQL / Supabase<\u002Fli><\u002Ful>\n      <\u002Fdiv>\n      <div style=\"padding:0 0 0 20px;border-left:2px solid var(--color-divider);display:flex;flex-direction:column;gap:14px\">\n        <h6 style=\"margin:0;color:var(--accent-text)\">Ferramentas<\u002Fh6>\n        <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;font-weight:800;font-size:clamp(22px,2.4vw,30px);letter-spacing:-.025em;line-height:1.25\"><li>Git / GitHub<\u002Fli><li>Linux<\u002Fli><\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"contato\" data-screen-label=\"Contato\" style=\"background:#ec3013;color:#f3f2f2\">\n    <div style=\"max-width:1280px;margin:0 auto;padding:clamp(56px,9vw,120px) clamp(20px,5vw,72px);display:flex;flex-direction:column;gap:clamp(32px,5vw,64px)\">\n      <div style=\"border-top:2px solid #f3f2f2;padding-top:14px;display:flex;justify-content:space-between;font-size:12px;letter-spacing:.1em;text-transform:uppercase\"><span>04<\u002Fspan><span>Contato<\u002Fspan><\u002Fdiv>\n      <h2 style=\"font-size:clamp(48px,10vw,150px);letter-spacing:-.045em;line-height:.88;margin:0\">Vamos<br>conversar.<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px\">\n        <a href=\"https://github.com/gHombris\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 20px;background:#201e1d;color:#f3f2f2;text-decoration:none;font-weight:800;font-size:18px\" style-hover=\"background:#000\"><span style=\"display:flex;flex-direction:column;gap:2px\"><span>GitHub<\u002Fspan><span style=\"font-weight:400;font-size:13px\">github.com/gHombris<\u002Fspan><\u002Fspan><span>↗<\u002Fspan><\u002Fa>\n        <a href=\"https://linkedin.com/in/gabrielhombris/\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 20px;background:#201e1d;color:#f3f2f2;text-decoration:none;font-weight:800;font-size:18px\" style-hover=\"background:#000\"><span style=\"display:flex;flex-direction:column;gap:2px\"><span>LinkedIn<\u002Fspan><span style=\"font-weight:400;font-size:13px\">linkedin.com/in/gabrielhombris<\u002Fspan><\u002Fspan><span>↗<\u002Fspan><\u002Fa>\n        <a href=\"mailto:gabriel.hombris@gmail.com\" style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 20px;border:2px solid #f3f2f2;color:#f3f2f2;text-decoration:none;font-weight:800;font-size:18px\" style-hover=\"background:#201e1d;border-color:#201e1d\"><span style=\"display:flex;flex-direction:column;gap:2px;min-width:0\"><span>E-mail<\u002Fspan><span style=\"font-weight:400;font-size:13px;overflow-wrap:anywhere\">gabriel.hombris@gmail.com<\u002Fspan><\u002Fspan><span>↗<\u002Fspan><\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:12px;border-top:2px solid #f3f2f2;padding-top:10px\"><span>© 2026 Gabriel Hombris<\u002Fspan><a href=\"#topo\" style=\"color:#f3f2f2\">Voltar ao topo ↑<\u002Fa><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;intensidade3d&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Sutil&quot;,&quot;Média&quot;,&quot;Marcante&quot;],&quot;default&quot;:&quot;Média&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;3D&quot;},&quot;pulsos&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;3D&quot;},&quot;inclinacaoCards&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;3D&quot;},&quot;temaInicial&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Claro&quot;,&quot;Escuro&quot;],&quot;default&quot;:&quot;Claro&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Tema&quot;}}\">\nclass Component extends DCLogic {\n  state = { theme: null, gl: 'loading', open1: false, open2: false, open3: false };\n  canvasRef = React.createRef();\n\n  theme() {\n    return this.state.theme || ((this.props.temaInicial ?? 'Claro') === 'Escuro' ? 'dark' : 'light');\n  }\n  applyTheme() {\n    const t = this.theme();\n    document.documentElement.setAttribute('data-theme', t);\n    if (this.gl) {\n      const ink = t === 'dark' ? 0xf3f2f2 : 0x201e1d, acc = t === 'dark' ? 0xff563c : 0xec3013;\n      this.gl.nodeMat.color.setHex(ink); this.gl.lineMat.color.setHex(ink); this.gl.cloudMat.color.setHex(ink); this.gl.pulseMat.color.setHex(acc);\n      if (this.gl.reduce) this.gl.frame(0);\n    }\n  }\n  componentDidMount() {\n    try { const s = localStorage.getItem('gh-portfolio-theme'); if (s === 'dark' || s === 'light') this.setState({ theme: s }); } catch (e) {}\n    this.applyTheme();\n    const probe = document.createElement('canvas');\n    let ok = false;\n    try { ok = !!(window.WebGLRenderingContext && (probe.getContext('webgl') || probe.getContext('experimental-webgl'))); } catch (e) {}\n    if (!ok) { this.setState({ gl: 'fallback' }); return; }\n    const load = () => {\n      if (this.dead) return;\n      if (window.THREE) return this.initGL();\n      const s = document.createElement('script');\n      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';\n      s.async = true;\n      s.onload = () => this.initGL();\n      s.onerror = () => this.setState({ gl: 'fallback' });\n      document.head.appendChild(s);\n    };\n    (window.requestIdleCallback || ((f) => setTimeout(f, 200)))(load, { timeout: 1500 });\n  }\n  componentDidUpdate() { this.applyTheme(); }\n  componentWillUnmount() {\n    this.dead = true;\n    if (this.gl) { cancelAnimationFrame(this.gl.raf); this.gl.off(); this.gl.renderer.dispose(); }\n  }\n\n  initGL() {\n    if (this.dead || this.gl) return;\n    const canvas = this.canvasRef.current, T = window.THREE;\n    if (!canvas || !T) return this.setState({ gl: 'fallback' });\n    const small = Math.min(window.innerWidth, window.innerHeight) < 720 || window.innerWidth < 820;\n    const touch = window.matchMedia && window.matchMedia('(hover: none)').matches;\n    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    let renderer;\n    try { renderer = new T.WebGLRenderer({ canvas, alpha: true, antialias: !small, powerPreference: 'low-power' }); }\n    catch (e) { return this.setState({ gl: 'fallback' }); }\n    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, small ? 1.5 : 2));\n    const scene = new T.Scene();\n    const camera = new T.PerspectiveCamera(50, 1, 0.1, 100);\n    camera.position.z = 14;\n    const net = new T.Group(); scene.add(net);\n\n    // layered network\n    const layers = small ? [5, 9, 9, 5] : [8, 16, 22, 22, 16, 8];\n    const k = small ? 2 : 3, span = small ? 6 : 9;\n    const nodes = [], byLayer = [];\n    layers.forEach((n, li) => {\n      const ids = [];\n      for (let i = 0; i < n; i++) {\n        const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * (1.2 + n * 0.11);\n        ids.push(nodes.length);\n        nodes.push([(li / (layers.length - 1) - 0.5) * span + (Math.random() - 0.5) * 0.5, Math.cos(a) * r, Math.sin(a) * r]);\n      }\n      byLayer.push(ids);\n    });\n    const edges = [];\n    for (let li = 0; li < byLayer.length - 1; li++) {\n      byLayer[li].forEach((a) => {\n        const near = byLayer[li + 1].map((b) => [b, (nodes[a][1] - nodes[b][1]) ** 2 + (nodes[a][2] - nodes[b][2]) ** 2]).sort((x, y) => x[1] - y[1]).slice(0, k);\n        near.forEach(([b]) => edges.push([a, b]));\n      });\n    }\n    const N = nodes.length;\n    const base = new Float32Array(N * 3), pos = new Float32Array(N * 3);\n    nodes.forEach((p, i) => { base.set(p, i * 3); pos.set(p, i * 3); });\n    const nodeGeo = new T.BufferGeometry();\n    nodeGeo.setAttribute('position', new T.BufferAttribute(pos, 3));\n    const nodeMat = new T.PointsMaterial({ size: small ? 0.16 : 0.13, transparent: true, depthWrite: false });\n    net.add(new T.Points(nodeGeo, nodeMat));\n    const linePos = new Float32Array(edges.length * 6);\n    const lineGeo = new T.BufferGeometry();\n    lineGeo.setAttribute('position', new T.BufferAttribute(linePos, 3));\n    const lineMat = new T.LineBasicMaterial({ transparent: true, depthWrite: false });\n    net.add(new T.LineSegments(lineGeo, lineMat));\n    const fillLines = () => {\n      for (let e = 0; e < edges.length; e++) {\n        const a = edges[e][0] * 3, b = edges[e][1] * 3, o = e * 6;\n        linePos[o] = pos[a]; linePos[o + 1] = pos[a + 1]; linePos[o + 2] = pos[a + 2];\n        linePos[o + 3] = pos[b]; linePos[o + 4] = pos[b + 1]; linePos[o + 5] = pos[b + 2];\n      }\n      lineGeo.attributes.position.needsUpdate = true;\n    };\n    fillLines();\n\n    // signal pulses\n    const P = small ? 10 : 30;\n    const pulses = Array.from({ length: P }, () => ({ e: (Math.random() * edges.length) | 0, t: Math.random(), v: 0.25 + Math.random() * 0.5 }));\n    const pulsePos = new Float32Array(P * 3);\n    const pulseGeo = new T.BufferGeometry();\n    pulseGeo.setAttribute('position', new T.BufferAttribute(pulsePos, 3));\n    const pulseMat = new T.PointsMaterial({ size: small ? 0.22 : 0.2, transparent: true, depthWrite: false });\n    const pulsePts = new T.Points(pulseGeo, pulseMat); net.add(pulsePts);\n\n    // ambient cloud\n    const C = small ? 110 : 420, cpos = new Float32Array(C * 3);\n    for (let i = 0; i < C; i++) { cpos[i * 3] = (Math.random() - 0.5) * 34; cpos[i * 3 + 1] = (Math.random() - 0.5) * 30; cpos[i * 3 + 2] = -12 + Math.random() * 14; }\n    const cloudGeo = new T.BufferGeometry();\n    cloudGeo.setAttribute('position', new T.BufferAttribute(cpos, 3));\n    const cloudMat = new T.PointsMaterial({ size: 0.06, transparent: true, depthWrite: false });\n    const cloud = new T.Points(cloudGeo, cloudMat); scene.add(cloud);\n\n    const mouse = { x: 0, y: 0, active: false }, eased = { x: 0, y: 0 };\n    const v = new T.Vector3(), dir = new T.Vector3();\n    let W = 0, H = 0, last = 0, time = 0;\n    const resize = () => {\n      W = window.innerWidth; H = window.innerHeight;\n      renderer.setSize(W, H, false);\n      camera.aspect = W / H; camera.updateProjectionMatrix();\n      if (reduce) frame(0);\n    };\n    const onMove = (e) => { mouse.x = (e.clientX / W) * 2 - 1; mouse.y = (e.clientY / H) * 2 - 1; mouse.active = true; };\n    const onScroll = () => { if (reduce) frame(0); };\n    const frame = (now) => {\n      const dt = last ? Math.min(0.05, (now - last) / 1000) : 0; last = now; time += dt;\n      const kI = { 'Sutil': 0.38, 'Média': 0.62, 'Marcante': 0.95 }[this.props.intensidade3d ?? 'Média'] || 0.62;\n      const s = (window.scrollY || document.documentElement.scrollTop || 0) / Math.max(1, H);\n      const s1 = Math.min(1, s), narrow = W < 820;\n      eased.x += (mouse.x - eased.x) * 0.06; eased.y += (mouse.y - eased.y) * 0.06;\n      const sc = narrow ? 0.62 : 1;\n      net.scale.setScalar(sc);\n      net.position.x = narrow ? 0.4 : 4.4 * (1 - s1) + Math.sin(s * 0.9) * 1.2 * s1;\n      net.position.y = (narrow ? -2.6 : 0.2) * (1 - s1 * 0.7);\n      net.position.z = -s1 * 3;\n      net.rotation.y = -0.35 + time * 0.06 + s * 0.55 + eased.x * 0.28;\n      net.rotation.x = 0.12 + eased.y * 0.18;\n      net.rotation.z = s * 0.12;\n      cloud.position.y = s * 1.4; cloud.rotation.y = eased.x * 0.04;\n\n      if (!touch && !small && mouse.active) {\n        v.set(mouse.x, -mouse.y, 0.5).unproject(camera);\n        dir.copy(v).sub(camera.position).normalize();\n        const d = (net.position.z - camera.position.z) / dir.z;\n        v.copy(camera.position).addScaledVector(dir, d);\n        net.worldToLocal(v);\n        const R = 2.6;\n        for (let i = 0; i < N; i++) {\n          const o = i * 3, dx = base[o] - v.x, dy = base[o + 1] - v.y, dz = base[o + 2] - v.z;\n          const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);\n          let tx = base[o], ty = base[o + 1], tz = base[o + 2];\n          if (dist < R && dist > 0.001) { const f = (1 - dist / R) ** 2 * 1.3 / dist; tx += dx * f; ty += dy * f; tz += dz * f; }\n          pos[o] += (tx - pos[o]) * 0.1; pos[o + 1] += (ty - pos[o + 1]) * 0.1; pos[o + 2] += (tz - pos[o + 2]) * 0.1;\n        }\n        nodeGeo.attributes.position.needsUpdate = true;\n        fillLines();\n      }\n      const showP = this.props.pulsos ?? true;\n      pulsePts.visible = showP;\n      if (showP) {\n        for (let i = 0; i < P; i++) {\n          const p = pulses[i]; p.t += dt * p.v;\n          if (p.t > 1) { p.t = 0; p.e = (Math.random() * edges.length) | 0; }\n          const a = edges[p.e][0] * 3, b = edges[p.e][1] * 3, o = i * 3;\n          pulsePos[o] = pos[a] + (pos[b] - pos[a]) * p.t; pulsePos[o + 1] = pos[a + 1] + (pos[b + 1] - pos[a + 1]) * p.t; pulsePos[o + 2] = pos[a + 2] + (pos[b + 2] - pos[a + 2]) * p.t;\n        }\n        pulseGeo.attributes.position.needsUpdate = true;\n      }\n      const fade = (1 - 0.6 * s1) * (narrow ? 0.7 : 1);\n      nodeMat.opacity = Math.min(1, kI * 1.3) * fade;\n      lineMat.opacity = kI * 0.42 * fade;\n      cloudMat.opacity = kI * 0.6 * (1 - 0.3 * s1);\n      pulseMat.opacity = Math.min(1, kI * 1.5) * Math.max(fade, 0.6);\n      renderer.render(scene, camera);\n    };\n    const loop = (now) => { g.raf = requestAnimationFrame(loop); if (!document.hidden) frame(now); };\n    window.addEventListener('resize', resize);\n    window.addEventListener('pointermove', onMove, { passive: true });\n    window.addEventListener('scroll', onScroll, { passive: true });\n    const g = this.gl = { renderer, nodeMat, lineMat, cloudMat, pulseMat, reduce, frame, raf: 0,\n      off: () => { window.removeEventListener('resize', resize); window.removeEventListener('pointermove', onMove); window.removeEventListener('scroll', onScroll); } };\n    this.applyTheme();\n    resize();\n    if (reduce) frame(0); else g.raf = requestAnimationFrame(loop);\n    this.setState({ gl: 'ready' });\n  }\n\n  tilt = (e) => {\n    if (!(this.props.inclinacaoCards ?? true) || e.pointerType === 'touch') return;\n    const el = e.currentTarget, r = el.getBoundingClientRect();\n    const x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;\n    el.style.transform = 'perspective(1400px) rotateX(' + (-y * 3).toFixed(2) + 'deg) rotateY(' + (x * 4).toFixed(2) + 'deg)';\n  };\n  untilt = (e) => { e.currentTarget.style.transform = ''; };\n\n  renderVals() {\n    const dark = this.theme() === 'dark';\n    const lab = (o) => (o ? 'Fechar detalhes −' : 'Ver detalhes +');\n    const tg = (key) => () => this.setState((s) => ({ [key]: !s[key] }));\n    return {\n      canvasRef: this.canvasRef,\n      showFallback: this.state.gl !== 'ready',\n      themeLabel: dark ? 'Claro' : 'Escuro',\n      toggleTheme: () => {\n        const t = dark ? 'light' : 'dark';\n        try { localStorage.setItem('gh-portfolio-theme', t); } catch (e) {}\n        this.setState({ theme: t });\n      },\n      hint: this.state.gl === 'ready' ? 'A rede reage ao cursor' : '',\n      tilt: this.tilt, untilt: this.untilt,\n      open1: this.state.open1, open2: this.state.open2, open3: this.state.open3,\n      label1: lab(this.state.open1), label2: lab(this.state.open2), label3: lab(this.state.open3),\n      toggle1: tg('open1'), toggle2: tg('open2'), toggle3: tg('open3'),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002F
